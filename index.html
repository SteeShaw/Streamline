<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill Tracker</title>
<style>
  :root {
    --bg: #f5f5f4; --card: #ffffff; --text: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --accent: #2563eb; --accent-text: #ffffff;
    --soon: #d97706; --late: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --card: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --line: #292524; --accent: #3b82f6; --soon: #f59e0b; --late: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 16px; }

  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted); padding: 10px;
    border-radius: 7px; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button.active { background: var(--accent); color: var(--accent-text); }

  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .stat small { color: var(--muted); display: block; font-size: 12px; }
  .stat b { font-size: 18px; }

  form { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  form .full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
  input, select { font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 9px; width: 100%; }
  .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
  .btn { border: 0; border-radius: 7px; padding: 10px 14px; font: inherit; font-weight: 600;
    cursor: pointer; background: var(--accent); color: var(--accent-text); flex: 1; }
  .btn.ghost { background: none; color: var(--muted); border: 1px solid var(--line); flex: 0 0 auto; }

  .bill { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .bill .info { flex: 1; min-width: 0; }
  .bill .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bill .meta { color: var(--muted); font-size: 13px; }
  .bill .due.soon { color: var(--soon); font-weight: 600; }
  .bill .due.today { color: var(--late); font-weight: 600; }
  .bill .amt { font-weight: 700; text-align: right; }
  .bill .amt small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .icon { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 24px; }
  footer { display: flex; gap: 8px; justify-content: center; margin-top: 20px; }
  footer .btn { flex: 0 0 auto; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Bill Tracker</h1>

  <div class="tabs">
    <button data-tab="personal" class="active">Personal</button>
    <button data-tab="work">Work</button>
  </div>

  <div class="totals">
    <div class="stat"><small>Monthly</small><b id="tMonth">£0</b></div>
    <div class="stat"><small>Yearly</small><b id="tYear">£0</b></div>
    <div class="stat"><small>Next 30 days</small><b id="t30">£0</b></div>
  </div>

  <form id="form">
    <label class="full">Bill name
      <input id="fName" required placeholder="e.g. Netflix">
    </label>
    <label>Amount (£)
      <input id="fAmount" type="number" step="0.01" min="0" required>
    </label>
    <label>Repeats
      <select id="fFreq">
        <option value="weekly">Weekly</option>
        <option value="fortnightly">Fortnightly</option>
        <option value="monthly" selected>Monthly</option>
        <option value="quarterly">Quarterly</option>
        <option value="yearly">Yearly</option>
      </select>
    </label>
    <label class="full">First / next due date
      <input id="fDate" type="date" required>
    </label>
    <div class="actions">
      <button class="btn" type="submit" id="fSubmit">Add bill</button>
      <button class="btn ghost" type="button" id="fCancel" hidden>Cancel</button>
    </div>
  </form>

  <div id="list"></div>

  <footer>
    <button class="btn ghost" id="exportBtn">Export</button>
    <button class="btn ghost" id="importBtn">Import</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </footer>
</main>

<script>
const KEY = 'billTracker.v1';
const PER_MONTH = { weekly: 52/12, fortnightly: 26/12, monthly: 1, quarterly: 1/3, yearly: 1/12 };
const LABEL = { weekly: 'Weekly', fortnightly: 'Fortnightly', monthly: 'Monthly', quarterly: 'Quarterly', yearly: 'Yearly' };

let data = load();
let tab = 'personal';
let editingId = null;

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.personal && d.work) return d; } catch (e) {}
  return { personal: [], work: [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

const gbp = n => '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

// Step a date forward by one period; monthly-style steps keep the original day (clamped to month end)
function step(date, freq, anchorDay) {
  const d = new Date(date);
  if (freq === 'weekly') { d.setDate(d.getDate() + 7); return d; }
  if (freq === 'fortnightly') { d.setDate(d.getDate() + 14); return d; }
  const months = { monthly: 1, quarterly: 3, yearly: 12 }[freq];
  const y = d.getFullYear(), m = d.getMonth() + months;
  const last = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(anchorDay, last));
}

function nextDue(bill, from = today()) {
  let d = parse(bill.date);
  const anchor = d.getDate();
  while (d < from) d = step(d, bill.freq, anchor);
  return d;
}

function dueIn(bill, from, to) { // total charged between dates (inclusive)
  let d = nextDue(bill, from), total = 0;
  const anchor = parse(bill.date).getDate();
  while (d <= to) { total += bill.amount; d = step(d, bill.freq, anchor); }
  return total;
}

function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const bills = data[tab];
  const t = today(), in30 = new Date(t); in30.setDate(in30.getDate() + 30);

  const monthly = bills.reduce((s, b) => s + b.amount * PER_MONTH[b.freq], 0);
  document.getElementById('tMonth').textContent = gbp(monthly);
  document.getElementById('tYear').textContent = gbp(monthly * 12);
  document.getElementById('t30').textContent = gbp(bills.reduce((s, b) => s + dueIn(b, t, in30), 0));

  const list = document.getElementById('list');
  if (!bills.length) { list.innerHTML = `<div class="empty">No ${tab} bills yet.</div>`; return; }

  list.innerHTML = bills
    .map(b => ({ b, next: nextDue(b) }))
    .sort((a, z) => a.next - z.next)
    .map(({ b, next }) => {
      const days = Math.round((next - t) / 864e5);
      const when = days === 0 ? 'Due today' : days === 1 ? 'Due tomorrow' : `Due in ${days} days`;
      const cls = days === 0 ? 'today' : days <= 7 ? 'soon' : '';
      const date = next.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
      const perMonth = b.freq === 'monthly' ? '' : `<small>${gbp(b.amount * PER_MONTH[b.freq])}/mo</small>`;
      return `<div class="bill">
        <div class="info">
          <div class="name">${esc(b.name)}</div>
          <div class="meta">${LABEL[b.freq]} · ${date} · <span class="due ${cls}">${when}</span></div>
        </div>
        <div class="amt">${gbp(b.amount)}${perMonth}</div>
        <button class="icon" data-edit="${b.id}" title="Edit">✎</button>
        <button class="icon" data-del="${b.id}" title="Delete">✕</button>
      </div>`;
    }).join('');
}

const esc = s => s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function resetForm() {
  editingId = null;
  document.getElementById('form').reset();
  document.getElementById('fFreq').value = 'monthly';
  document.getElementById('fDate').valueAsDate = new Date();
  document.getElementById('fSubmit').textContent = 'Add bill';
  document.getElementById('fCancel').hidden = true;
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const bill = {
    id: editingId || Date.now().toString(36),
    name: document.getElementById('fName').value.trim(),
    amount: parseFloat(document.getElementById('fAmount').value),
    freq: document.getElementById('fFreq').value,
    date: document.getElementById('fDate').value,
  };
  const list = data[tab];
  const i = list.findIndex(b => b.id === bill.id);
  i >= 0 ? (list[i] = bill) : list.push(bill);
  save(); resetForm(); render();
});

document.getElementById('fCancel').addEventListener('click', resetForm);

document.getElementById('list').addEventListener('click', e => {
  const del = e.target.dataset.del, edit = e.target.dataset.edit;
  if (del && confirm('Delete this bill?')) {
    data[tab] = data[tab].filter(b => b.id !== del); save(); render();
  }
  if (edit) {
    const b = data[tab].find(x => x.id === edit);
    editingId = b.id;
    document.getElementById('fName').value = b.name;
    document.getElementById('fAmount').value = b.amount;
    document.getElementById('fFreq').value = b.freq;
    document.getElementById('fDate').value = b.date;
    document.getElementById('fSubmit').textContent = 'Save changes';
    document.getElementById('fCancel').hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

document.querySelectorAll('.tabs button').forEach(b =>
  b.addEventListener('click', () => { tab = b.dataset.tab; resetForm(); render(); }));

document.getElementById('exportBtn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'bills.json'; a.click();
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!d.personal || !d.work) throw 0;
    data = d; save(); render();
  } catch { alert('That file doesn\'t look like a bill tracker export.'); }
  e.target.value = '';
});

resetForm();
render();
</script>
</body>
</html>
